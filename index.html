<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MISEG - Escáner QR</title>

  <script src="https://unpkg.com/qr-scanner/qr-scanner.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 20px auto;
      padding: 16px;
      color: #222;
    }

    button {
      padding: 12px;
      margin: 6px 0;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
    }

    #lectorQR {
      width: 100%;
      margin-top: 12px;
      background: #111;
      overflow: hidden;
    }

    #videoQR {
      width: 100%;
      display: block;
    }

    #resultado {
      padding: 12px;
      background: #f1f5f9;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <h2>MISEG — Escáner QR</h2>
  <p>Escanea el código de una herramienta. Puedes escanear varias.</p>

  <div id="lectorQR">
    <video id="videoQR" playsinline muted></video>
  </div>

  <p id="resultado">Esperando para escanear...</p>

  <button type="button" onclick="iniciarEscaner()">
    Abrir cámara y escanear
  </button>

  <button type="button" onclick="detenerEscaner()">
    Cerrar cámara
  </button>

  <button type="button" onclick="copiarIDs()">
    Copiar IDs escaneados
  </button>

  <button type="button" onclick="enviarAMISEG()">
    Enviar a MISEG
  </button>

  <button type="button" onclick="limpiarIDs()">
    Limpiar lista
  </button>

  <h3>Herramientas escaneadas</h3>
  <ol id="lista"></ol>

  <script>
    let escaner = null;
    let iniciando = false;
    const ids = [];

    const video = document.getElementById("videoQR");

    function mostrar(mensaje) {
      document.getElementById("resultado").textContent = mensaje;
    }

    function actualizarLista() {
      const lista = document.getElementById("lista");
      lista.replaceChildren();

      ids.forEach(id => {
        const li = document.createElement("li");
        li.textContent = id;
        lista.appendChild(li);
      });
    }

    function procesarQR(texto) {
      const coincidencia = texto.match(/HER-\d{4}/i);

      if (!coincidencia) {
        mostrar("El QR no contiene un ID HER válido.");
        return;
      }

      const id = coincidencia[0].toUpperCase();

      if (!ids.includes(id)) {
        ids.push(id);
        actualizarLista();
        mostrar("Agregado: " + id);
      } else {
        mostrar("Ya estaba en la lista: " + id);
      }
    }

    async function iniciarEscaner() {
      if (iniciando) return;

      if (typeof QrScanner === "undefined") {
        mostrar("No se pudo cargar el nuevo lector QR. Revisa tu conexión.");
        return;
      }

      iniciando = true;
      mostrar("Solicitando acceso a la cámara...");

      try {
        if (!escaner) {
          escaner = new QrScanner(
            video,
            resultado => {
              procesarQR(resultado);
            },
            {
              preferredCamera: "environment",
              maxScansPerSecond: 20,
              highlightScanRegion: false,
              highlightCodeOutline: false,
              returnDetailedScanResult: false
            }
          );
        }

        await escaner.start();
        mostrar("Cámara abierta. Acerca una herramienta para escanear.");

      } catch (error) {
        mostrar("No se pudo abrir la cámara: " + error);
      } finally {
        iniciando = false;
      }
    }

    async function detenerEscaner() {
      if (!escaner) {
        mostrar("La cámara ya está cerrada.");
        return;
      }

      try {
        escaner.stop();
        mostrar("Cámara cerrada.");
      } catch (error) {
        mostrar("No se pudo cerrar la cámara: " + error);
      }
    }

    async function copiarIDs() {
      if (!ids.length) {
        mostrar("Primero escanea al menos una herramienta.");
        return;
      }

      try {
        await navigator.clipboard.writeText(ids.join("\n"));
        mostrar("IDs copiados correctamente.");
      } catch (error) {
        mostrar("No se pudo copiar automáticamente.");
      }
    }

    function limpiarIDs() {
      ids.length = 0;
      actualizarLista();
      mostrar("Lista limpia.");
    }

    function enviarAMISEG() {
      if (!ids.length) {
        mostrar("Primero escanea al menos una herramienta.");
        return;
      }

      const destino =
        "https://script.google.com/macros/s/AKfycbzsaQIgB7K7Mj5TETUKKXkJ9i48iAno1UNPTmEw9TqI-kB_3BkgPPP1ByphmSSf88gn4A/exec";

      const parametros = new URLSearchParams({
        ids: ids.join(",")
      });

      window.open(
        destino + "?" + parametros.toString(),
        "_blank"
      );
    }
  </script>

</body>
</html>
